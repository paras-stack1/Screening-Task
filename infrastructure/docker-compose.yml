# Local development infrastructure for BalSwasthya AI.
# Run from the repo root:
#   docker compose -f infrastructure/docker-compose.yml --env-file .env up -d
#
# Only PostgreSQL runs in Docker for now. The API and the worker app run
# directly on the host for a fast dev loop. The AI service is owned by a
# separate team and is started on its own.

name: balswasthya

services:
  postgres:
    image: postgres:17-alpine
    container_name: balswasthya-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:?POSTGRES_USER is required (see .env.example)}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?POSTGRES_PASSWORD is required (see .env.example)}
      POSTGRES_DB: ${POSTGRES_DB:?POSTGRES_DB is required (see .env.example)}
      TZ: Asia/Kolkata
      PGTZ: Asia/Kolkata
    ports:
      # Bound to localhost only so the database is not exposed on the LAN.
      - '127.0.0.1:${POSTGRES_HOST_PORT:-5433}:5432'
    volumes:
      - balswasthya_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}']
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 10s

volumes:
  balswasthya_pgdata:
    name: balswasthya_pgdata
